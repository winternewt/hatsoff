[project]
name = "hatsoff"
version = "0.1.0"
description = "Zero-mode counting and multifractal analysis on the hat monotile family"
authors = [
    {name = "Newton Winter", email = "isoutthere@gmail.com"},
]
maintainers = [
    {name = "Newton Winter", email = "isoutthere@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "scipy>=1.17.1",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "hat-amp>=0.1.1",
]

[project.scripts]
hatsoff = "hatsoff.main:main"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]
